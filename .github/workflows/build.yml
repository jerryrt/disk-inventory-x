name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check that the Xcode project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code -- "Disk Inventory X.xcodeproj"

      - name: Build
        run: |
          xcodebuild -project "Disk Inventory X.xcodeproj" \
            -scheme "Disk Inventory X" -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- build

      - uses: actions/upload-artifact@v4
        with:
          name: Disk Inventory X
          path: build/Build/Products/Release/Disk Inventory X.app
