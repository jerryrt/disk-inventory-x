# Xcode project definition. Regenerate the .xcodeproj with:
#   xcodegen generate
name: Disk Inventory X
options:
  bundleIdPrefix: io.github.jerryrt
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PRECOMPILE_PREFIX_HEADER: YES
    GCC_PREFIX_HEADER: "DiskInventoryX/Disk Inventory X_Prefix.pch"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]

targets:
  Disk Inventory X:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jerryrt.DiskInventoryX
        PRODUCT_NAME: Disk Inventory X
        INFOPLIST_FILE: DiskInventoryX/Info.plist
        CODE_SIGN_ENTITLEMENTS: DiskInventoryX/Disk Inventory X.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/DiskInventoryX", "$(SRCROOT)/DiskInventoryX/CocoaTech-Depreciated", "$(SRCROOT)/DiskInventoryX/Foundation Extensions", "$(SRCROOT)/TreeMapView"]
    sources:
      - path: DiskInventoryX
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "CocoaTech-Depreciated/NTID3Helper.*"
      - path: TreeMapView
        includes:
          - "*.h"
          - "*.m"
        # the TreeMapView sources use manual reference counting
        compilerFlags: ["-fno-objc-arc"]
    postCompileScripts:
      # XcodeGen does not add folders inside .lproj directories to the
      # resources, so copy the localized help books explicitly.
      - name: Copy Help Books
        basedOnDependencyAnalysis: false
        script: |
          set -e
          for dir in "${SRCROOT}"/DiskInventoryX/Resources/*.lproj/Help; do
            lproj=$(basename "$(dirname "$dir")")
            dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/${lproj}"
            mkdir -p "$dest"
            rsync -a --delete "$dir/" "$dest/Help/"
          done
